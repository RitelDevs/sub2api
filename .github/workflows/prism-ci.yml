name: Prism adapter CI

on:
  workflow_dispatch:
  push:
    branches: [main, production]
    paths: ['prism-adapter/**', '.github/workflows/prism-ci.yml']
  pull_request:
    paths: ['prism-adapter/**', '.github/workflows/prism-ci.yml']

permissions:
  contents: read

concurrency:
  group: prism-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prism-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install adapter wheels
        run: >-
          python -m pip install --only-binary=:all: -r prism-adapter/requirements.txt
      - name: Run offline adapter and cache tests
        run: python -m unittest discover -s prism-adapter -p 'test_*.py' -v
