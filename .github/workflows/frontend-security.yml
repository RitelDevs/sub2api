name: Frontend dependency security

on:
  workflow_dispatch:
  push:
    branches: [main, production]
    paths: ['frontend/package.json', 'frontend/pnpm-lock.yaml', '.github/audit-exceptions.yml', 'tools/check_pnpm_audit_exceptions.py', '.github/workflows/frontend-security.yml']
  pull_request:
    paths: ['frontend/package.json', 'frontend/pnpm-lock.yaml', '.github/audit-exceptions.yml', 'tools/check_pnpm_audit_exceptions.py', '.github/workflows/frontend-security.yml']
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: frontend-security-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  frontend-security:
    runs-on: ${{ vars.SUB2API_SUPPLEMENTARY_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        working-directory: frontend
        run: |
          pnpm audit --prod --audit-level=high --json > audit.json || true
      - name: Check audit exceptions
        run: |
          python tools/check_pnpm_audit_exceptions.py \
            --audit frontend/audit.json \
            --exceptions .github/audit-exceptions.yml
