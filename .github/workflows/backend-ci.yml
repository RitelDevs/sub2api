name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, production]
    paths: ['backend/**', 'deploy/**', 'prism-adapter/**', 'Makefile', '.github/**']
  pull_request:
    paths: ['backend/**', 'deploy/**', 'prism-adapter/**', 'Makefile', '.github/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  issue854-behavior:
    if: github.event_name == 'workflow_dispatch'
    env:
      EXPECTED_HEAD_SHA: ${{ github.sha }}
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git diff --exit-code
          mkdir -p "$RUNNER_TEMP/issue854-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/issue854-evidence/candidate.txt"
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install isolated Redis fixture dependency
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          if ! command -v redis-server >/dev/null; then
            brew install redis
          fi
          redis-server --version
      - name: Validate evidence parser mutations
        run: python3 -m unittest discover -s .github/scripts -p 'test_issue854_evidence.py'
      - name: RED exact baseline production blobs with candidate tests
        shell: bash
        run: |
          set -euo pipefail
          baseline=aa8e596e6d6f3e4648d6beba73b39b240dd5357a
          git worktree add --detach "$RUNNER_TEMP/issue854-red" "$EXPECTED_HEAD_SHA"
          git rev-parse "$baseline" "$baseline^{tree}" > "$RUNNER_TEMP/issue854-evidence/baseline.txt"
          git diff --name-only "$baseline" "$EXPECTED_HEAD_SHA" -- backend | while IFS= read -r target; do
            case "$target" in
              *_test.go) continue ;;
              *.go)
                if git cat-file -e "$baseline:$target" 2>/dev/null; then
                  printf '%s %s\n' "$(git rev-parse "$baseline:$target")" "$target" >> "$RUNNER_TEMP/issue854-evidence/baseline-blobs.txt"
                  git show "$baseline:$target" > "$RUNNER_TEMP/issue854-red/$target"
                  test "$(git hash-object "$RUNNER_TEMP/issue854-red/$target")" = "$(git rev-parse "$baseline:$target")"
                else
                  rm -- "$RUNNER_TEMP/issue854-red/$target"
                fi ;;
            esac
          done
          cd "$RUNNER_TEMP/issue854-red"
          bash "$GITHUB_WORKSPACE/.github/scripts/exclude-later-http2-red-fixtures.sh" "$baseline" . "$EXPECTED_HEAD_SHA" | tee "$RUNNER_TEMP/issue854-evidence/independent-fixtures.txt"
          bash "$GITHUB_WORKSPACE/.github/scripts/prepare-replay-red-fixtures.sh" "$baseline" . "$EXPECTED_HEAD_SHA" | tee "$RUNNER_TEMP/issue854-evidence/replay-fixtures.txt"
          git diff --stat > "$RUNNER_TEMP/issue854-evidence/red-diff.txt"
          for suite in lifecycle persistence upstream ws-upstream r1 http-empty-image; do
            case "$suite" in
              lifecycle) test_name=TestIssue854OwnerContinuation ;;
              persistence) test_name=TestIssue854OwnerFailurePersistence ;;
              upstream) test_name=TestIssue854UpstreamOwnerRateLimit ;;
              ws-upstream) test_name=TestIssue854WSOwnerRateLimit ;;
              r1) test_name=TestIssue854FreshOwnerSelection ;;
              http-empty-image) test_name='TestIssue854HTTPTransformMatrix$/.*/.*/empty_image' ;;
              http-transform) test_name=TestIssue854HTTPTransformMatrix ;;
              http-route) test_name=TestIssue854HTTPRouteAdmission ;;
            esac
            set +e
            (cd backend && go test -tags=unit,issue854matrix ./internal/handler -run "^${test_name}$" -count=1 -json -timeout=5m) > "$RUNNER_TEMP/issue854-evidence/red-$suite.jsonl" 2>&1
            status=$?
            set -e
            cat "$RUNNER_TEMP/issue854-evidence/red-$suite.jsonl"
            python3 .github/scripts/issue854-evidence.py RED "$status" "$RUNNER_TEMP/issue854-evidence/red-$suite.jsonl" "$suite"
          done
      - name: GREEN clean candidate and lifecycle race checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git diff --exit-code
          for suite in lifecycle persistence upstream ws-upstream r1 http-transform http-route; do
            case "$suite" in
              lifecycle) test_name=TestIssue854OwnerContinuation ;;
              persistence) test_name=TestIssue854OwnerFailurePersistence ;;
              upstream) test_name=TestIssue854UpstreamOwnerRateLimit ;;
              ws-upstream) test_name=TestIssue854WSOwnerRateLimit ;;
              r1) test_name=TestIssue854FreshOwnerSelection ;;
              http-transform) test_name=TestIssue854HTTPTransformMatrix ;;
              http-route) test_name=TestIssue854HTTPRouteAdmission ;;
            esac
            set +e
            (cd backend && go test -race -tags=unit,issue854matrix ./internal/handler -run "^${test_name}$" -count=1 -json -timeout=5m) > "$RUNNER_TEMP/issue854-evidence/green-$suite.jsonl" 2>&1
            status=$?
            set -e
            cat "$RUNNER_TEMP/issue854-evidence/green-$suite.jsonl"
            python3 .github/scripts/issue854-evidence.py GREEN "$status" "$RUNNER_TEMP/issue854-evidence/green-$suite.jsonl" "$suite"
          done
      - name: Contract and safety regressions
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && go test -race -tags=unit ./internal/handler -run '^Test(OpenAI409(WSReadableBoundaries|WSReviewRepairs|WSResidualRepairs|WSNativeNamespaceRecovery|WSRecoveredAudit|WSRecoveredAuditNextTurn|WSAmbiguousOracleMutations|HTTPTaskRebuild|HTTPRebuildBoundaries|HTTPToolDefinitionOracle)|OpenAI409HTTPProjectionAndPassthrough|OpenAI409WSInitialWithoutPointer|Issue854HTTPContinuation|Issue854LostOwnerEvidence|Issue805|Issue758WS)' -count=1 -json -timeout=10m) > "$RUNNER_TEMP/issue854-evidence/contracts.jsonl" 2>&1
          python3 .github/scripts/assert-readable-continuation.py --clean-log "$RUNNER_TEMP/issue854-evidence/contracts.jsonl"
          python3 .github/scripts/assert-ws-readable.py GREEN 0 "$RUNNER_TEMP/issue854-evidence/contracts.jsonl" ws-boundaries
          (cd backend && go test -race -tags=unit,issue854matrix ./internal/service -run '^Test(OpenAI409PhysicalTimezonePreservesReadableTask|OpenAI409NamespaceProjectionPreservesNumbers|Issue854HTTPProjectionIntegrity|Issue854BeforeSendRecoveryGuards|OpenAI409WSUnsentTurnBoundary|Issue715WS|OpenAI409WS|OpenAIWS.*(Agent|Replay))' -count=1 -json -timeout=5m) > "$RUNNER_TEMP/issue854-evidence/service-contracts.jsonl" 2>&1
          python3 .github/scripts/assert-readable-continuation.py --clean-log "$RUNNER_TEMP/issue854-evidence/service-contracts.jsonl"
      - name: PostgreSQL terminal failure roundtrip
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          ISSUE854_TEST_POSTGRES_DSN: postgres://fixture@127.0.0.1:15439/issue854_fixture?sslmode=disable
        shell: bash
        run: |
          set -euo pipefail
          brew install postgresql@16
          pg_bin="$(brew --prefix postgresql@16)/bin"
          "$pg_bin/initdb" -D "$RUNNER_TEMP/issue854-pg" -U fixture -A trust
          "$pg_bin/pg_ctl" -D "$RUNNER_TEMP/issue854-pg" -l "$RUNNER_TEMP/issue854-evidence/postgres.log" -o '-h 127.0.0.1 -p 15439' start
          trap '"$pg_bin/pg_ctl" -D "$RUNNER_TEMP/issue854-pg" stop -m fast' EXIT
          "$pg_bin/createdb" -h 127.0.0.1 -p 15439 -U fixture issue854_fixture
          set +e
          (cd backend && go test -race -tags=unit,issue854pg ./internal/handler -run '^TestIssue854PostgresRoundtrip$' -count=1 -json -timeout=5m) > "$RUNNER_TEMP/issue854-evidence/postgres.jsonl" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/issue854-evidence/postgres.jsonl"
          python3 .github/scripts/issue854-evidence.py GREEN "$status" "$RUNNER_TEMP/issue854-evidence/postgres.jsonl" postgres
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: issue854-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/issue854-evidence/

  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/install.sh deploy/install-mihomo-codex.sh deploy/migrate-mihomo-managed.sh
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: shadow_audit
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture -d shadow_audit"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.4'
      - name: Install Redis for isolated snapshot adapter checks
        run: |
          if ! command -v redis-server >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends redis-server
          fi
          redis-server --version
      - name: Compose runtime configuration
        run: /bin/sh deploy/tests/docker-compose-security-test.sh
      - name: Unit and integration tests (one combined run)
        working-directory: backend
        env:
          CI: 'true'
          PROMPT_AUDIT_TEST_POSTGRES_DSN: 'postgres://fixture:fixture@127.0.0.1:15432/shadow_audit?sslmode=disable'
          PROMPT_AUDIT_TEST_REDIS_ADDR: '127.0.0.1:16379'
          GOFLAGS: '-p=1'
        run: make test-all

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.4'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: bash -n .github/release-tools/release-images.sh
      - run: bash -n deploy/upgrade-k3s.sh
      - run: python -m unittest discover -s deploy/tests -p 'test_upgrade_k3s.py'
      - name: Install checksum-pinned Kustomize for offline gateway rendering
        run: |
          mkdir -p "$RUNNER_TEMP/sub2api-kustomize"
          curl --fail --show-error --silent --location \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/sub2api-kustomize/kustomize.tar.gz"
          printf '%s  %s\n' 'ea375e7372f9aa029129d4b2d16c66b7750b7f1213c4f66f910d981c895818d8' \
            "$RUNNER_TEMP/sub2api-kustomize/kustomize.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/sub2api-kustomize/kustomize.tar.gz" -C "$RUNNER_TEMP/sub2api-kustomize" kustomize
          echo "$RUNNER_TEMP/sub2api-kustomize" >> "$GITHUB_PATH"
      - run: python -m unittest discover -s deploy/tests -p 'test_gateway_render*.py'
      - name: Offline multi-host contract checks
        run: python -m unittest discover -s deploy/tests -p 'test_multihost_preflight.py'
      - run: python -m unittest discover -s deploy/tests -p 'test_migrate_reauth_managed.py'
      - run: python -m unittest discover -s deploy/connection-diagnostics -p 'test_collect.py'

  prism-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install adapter wheels
        run: >-
          python -m pip install --only-binary=:all: -r prism-adapter/requirements.txt
      - name: Run offline adapter and cache tests
        run: python -m unittest discover -s prism-adapter -p 'test_*.py' -v
